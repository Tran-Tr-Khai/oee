[project]
name = "oee-mail-downloader"
version = "0.1.0"
description = "Download selected Outlook attachments into the OEE raw data folder"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pywin32; sys_platform == 'win32'",
    "pyyaml>=6.0",
]

[project.scripts]
oee-mail-downloader = "oee_mail_downloader.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = []
